<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Community Manager Toolkit by CommonOS: two connected nodes">
  <title>Community Manager Toolkit by CommonOS</title>
  <!-- CommonOS palette: ink #0d0e10 ground, fog #eceae4 line and first node, N-7 #a3a7ad second node. Square: hosts round icons themselves. No text. -->
  <rect x="0" y="0" width="1024" height="1024" fill="#0d0e10"/>
  <!-- the introduction: one curved line hands a person over to another -->
  <path d="M 312 712 C 312 470 470 312 712 312" fill="none" stroke="#eceae4" stroke-width="52" stroke-linecap="round"/>
  <circle cx="312" cy="712" r="124" fill="#a3a7ad"/>
  <circle cx="712" cy="312" r="124" fill="#eceae4"/>
  <circle cx="312" cy="712" r="40" fill="#0d0e10"/>
  <circle cx="712" cy="312" r="40" fill="#0d0e10"/>
</svg>
